map $status $access_log_level {
    ~^5     error;
    ~^4     warning;
    default info;
}

log_format structured escape=json
    '{"datetime":"$time_iso8601","level":"$access_log_level",'
    '"message":"$request_method $uri","source":"nginx",'
    '"method":"$request_method","path":"$uri","status":$status,'
    '"bytes_sent":$body_bytes_sent,"duration":$request_time,'
    '"remote_addr":"$remote_addr","user_agent":"$http_user_agent"}';

access_log /dev/stdout structured;
